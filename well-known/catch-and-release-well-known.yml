notes:
  - id: spa_catch_all
    host: https://www.catchandrelease.com
    observation: >-
      The marketing site is a single-page application that answers HTTP 200 with an
      identical 8,411-byte index.html shell for EVERY unmatched path, including every
      /.well-known/* path and /openapi.json and /llms.txt. A 200 from this host is not
      evidence of a document. Only byte-identical-shell detection distinguishes a real
      hit from a soft-404 here, and every /.well-known/* path on www and the apex is a
      soft-404.
  - id: no_security_txt
    observation: >-
      No RFC 9116 security.txt is served on any host. No SecurityTxt pointer is emitted.
  - id: well_known_pointer_justified
    observation: >-
      The WellKnown pointer in apis.yml IS justified: two real documents (OIDC discovery
      and JWKS) are served with HTTP 200 and valid JSON from auth.catchandrelease.com,
      a host Catch&Release controls (CNAME catchandrelease.fusionauth.io).
