description: >-
  Catch&Release publishes no API and therefore publishes no rate limits. This is a
  recorded absence, not an unchecked field. The only machine-callable endpoints on
  the company's public surface are the Atlassian Statuspage JSON endpoints under
  https://status.catchandrelease.com/api/v2/, whose limits are set by Atlassian,
  not by Catch&Release. The terms of use go the other way and prohibit programmatic
  access outright: "agree not to scrape or otherwise use automated means to access
  or gather information from the Website".
