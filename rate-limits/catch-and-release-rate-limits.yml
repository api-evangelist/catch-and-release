notes:
  - >-
    No X-RateLimit-*, RateLimit-* or Retry-After headers were observed, because
    there is no unauthenticated Catch&Release API endpoint to observe them on.
    app.catchandrelease.com returns HTTP 302 to the FusionAuth authorize endpoint
    for every path probed.
  - >-
    robots.txt (https://www.catchandrelease.com/robots.txt, HTTP 200) disallows
    /dashboard, /collections*, /offer*, /shots*, /picker, /review, /request-*
    and /usage-details — the entire application surface — which is the closest
    thing the company publishes to a machine-access policy.
