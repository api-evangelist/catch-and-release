name: Catch&Release
description: 'Catch&Release is a UGC creator platform and content-licensing marketplace that
  helps brands and agencies discover, license, and clear rights for "found content" — real
  videos, photos, and footage created by everyday people and creators — for use in advertising
  and marketing campaigns. Its workspace lets marketing teams search and curate licensable
  moments, send content calls to its creator community, negotiate offers, and handle the
  legal clearance and rights packages, while creators earn passive income by licensing
  clips from their camera rolls. The platform pairs a brand/agency workspace (collections,
  storyboards, teams) with a creator community, using an access-first, pay-for-what-you-use
  model. Added to the API Evangelist network from an Accel portfolio lead.'
